name: Refresh AI Model Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  refresh-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build catalog snapshot
        env:
          STAGEWARDEN_ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.STAGEWARDEN_ARTIFICIAL_ANALYSIS_API_KEY }}
        run: python3 scripts/build_ai_models_catalog.py --aa

      - name: Run catalog tests
        run: python3 -m unittest tests.test_model_catalog tests.test_provider_registry

      - name: Commit refreshed catalog
        run: |
          if git diff --quiet -- data/ai_models_catalog.json; then
            echo "No catalog changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai_models_catalog.json
          git commit -m "stagewarden: refresh AI model catalog"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload catalog snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ai-models-catalog
          path: data/ai_models_catalog.json
          if-no-files-found: error
