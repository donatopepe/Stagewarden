name: Refresh AI Model Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  refresh-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build catalog snapshot
        run: python3 scripts/build_ai_models_catalog.py

      - name: Run catalog tests
        run: python3 -m unittest tests.test_model_catalog tests.test_provider_registry

      - name: Upload catalog snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ai-models-catalog
          path: data/ai_models_catalog.json
          if-no-files-found: error
